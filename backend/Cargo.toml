[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SQL toolkit. Drivers: sqlite (default) + postgres (DATABASE_URL switch).
# `any` lets one binary talk to either backend; `migrate` embeds ./migrations;
# `tls-rustls` (pure Rust) keeps the slim runtime image openssl-free.
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "tls-rustls"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"

[dev-dependencies]
axum-test = "17"
tokio = { version = "1", features = ["full"] }
