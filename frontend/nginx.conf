server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets (nginx:alpine ships gzip; keep it simple, no brotli).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets: immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API must never be served by nginx — the top-level vercel.json routes
    # /api/* to the backend service before traffic reaches this container.
    location /api/ {
        return 404;
    }

    # Cache-busted PWA + SEO artifacts: revalidate every deploy.
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|sitemap\.xml|rss\.xml|robots\.txt)$ {
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: everything else serves the app shell.
    location / {
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
